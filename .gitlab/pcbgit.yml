# Build and publish the repository's Dockerfile from a trusted PCBGit revision,
# then set PCBGIT_IMAGE to that immutable image reference in your project.
# Make distributor variables protected and restrict their use to trusted refs.
# Never run untrusted merge-request code with protected variables enabled.
pcbgit-review:
  image:
    name: $PCBGIT_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then base="$(git rev-parse HEAD^)"; fi
      set -- review --base "$base" --head "$CI_COMMIT_SHA" --output pcbgit-report --build-quantity "${PCBGIT_BUILD_QUANTITY:-1}"
      if [ -n "${PCBGIT_BOM:-}" ]; then set -- "$@" --bom "$PCBGIT_BOM"; fi
      if [ -n "${PCBGIT_PROFILE:-}" ]; then set -- "$@" --profile "$PCBGIT_PROFILE"; fi
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ] && { [ -z "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-}" ] || [ "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID}" != "${CI_MERGE_REQUEST_TARGET_PROJECT_ID:-}" ]; }; then
        unset DIGIKEY_CLIENT_ID DIGIKEY_CLIENT_SECRET DIGIKEY_ACCESS_TOKEN DIGIKEY_ACCOUNT_ID MOUSER_API_KEY
        set -- "$@" --skip-inventory
      fi
      pcbgit "$@"
  artifacts:
    when: always
    paths:
      - pcbgit-report/
