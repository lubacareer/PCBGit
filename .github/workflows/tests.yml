name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[geometry,test]'
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker build -t pcbgit-ci .
      - name: Smoke test container and committed Git snapshots
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" pcbgit-ci review --base HEAD^ --head HEAD --skip-inventory --output /workspace/pcbgit-report
          status=$?
          if [ "$status" -ne 0 ] && [ -f pcbgit-report/report.json ]; then cat pcbgit-report/report.json; fi
          exit "$status"
      - name: Exercise real KiCad exports and checks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" --entrypoint /opt/pcbgit/bin/python pcbgit-ci -m unittest discover -s tests -p test_kicad_integration.py -v
      - name: Exercise real KiCad multilayer export
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" --entrypoint /opt/pcbgit/bin/python pcbgit-ci -m unittest discover -s tests -p test_core.py -v
